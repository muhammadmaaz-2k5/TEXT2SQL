name: DataPilot AI — CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  NODE_ENV: test
  CREDENTIAL_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
  JWT_ACCESS_SECRET: dp_ci_jwt_access_secret_2026
  JWT_REFRESH_SECRET: dp_ci_jwt_refresh_secret_2026

jobs:
  quality-and-build:
    name: Lint, Typecheck, Unit & Integration Tests, Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint / Lint check
        run: pnpm lint

      - name: Run strict TypeScript typecheck
        run: pnpm typecheck

      - name: Run sql-guard unit tests & API integration tests
        run: pnpm test

      - name: Build all monorepo packages and apps
        run: pnpm build

