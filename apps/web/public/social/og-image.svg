    <text x="50" y="272" fill="#7A9BFF">SELECT <tspan fill="#E4E7EC">c.name,</tspan></text>
    <text x="50" y="294" fill="#E4E7EC">  <tspan fill="#FFB020">SUM</tspan>(o.amount) <tspan fill="#7A9BFF">AS</tspan> spend</text>
