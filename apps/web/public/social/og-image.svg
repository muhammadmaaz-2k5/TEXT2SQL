    <text x="50" y="338" fill="#7A9BFF">JOIN <tspan fill="#E4E7EC">orders o ON ...</tspan></text>
    <text x="50" y="360" fill="#7A9BFF">ORDER BY <tspan fill="#E4E7EC">spend DESC LIMIT 10;</tspan></text>
